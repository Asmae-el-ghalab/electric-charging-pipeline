<section class="hero">
  <div class="hero-container">
    <div class="hero-content">
      <h1 class="hero-title">
        Trouvez facilement les bornes de recharge <span class="highlight">au Maroc</span>
      </h1>
      <p class="hero-subtitle">
        Localisez les stations de recharge pour véhicules électriques près de chez vous, planifiez vos trajets et rechargez en toute simplicité.
      </p>
      <div class="hero-buttons">
        <a routerLink="/carte" class="btn-primary btn-large">
          📍 Consulter la carte
        </a>
        <a routerLink="/inscription" class="btn-secondary btn-large">
          ⚡ Commencer
        </a>
      </div>
    </div>
    <div class="hero-image">
  <img [src]="imagePath" alt="Electric Car">
</div>
  </div>
</section>
