<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<div class="admin-layout">
  <aside class="admin-sidebar">
   <div class="sidebar-logo">
 
  <span class="logo-text">ChargeFlow</span>
</div> 

 

    <nav class="sidebar-nav">
      <a
        routerLink="/admin"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link nav-link-main"
      >
        <span class="nav-icon">📈</span>
        <span class="nav-text">Vue d'ensemble</span>
      </a>

      <div class="nav-divider"></div>

      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">📊</span>
        <span class="nav-text">Gestion Bornes </span>
      </a>

      <a routerLink="/admin/utilisateurs" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">👥</span>
        <span class="nav-text">Utilisateurs</span>
      </a>

      <a routerLink="/admin/signalements" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">⚠️</span>
        <span class="nav-text">Signalements</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">👤</div>
        <div>
          <div class="user-name">{{ adminName || 'Admin' }}</div>
          <div class="user-role">Administrateur</div>
        </div>
      </div>
       
      <button class="btn-logout" (click)="logout()">
        <span>🚪</span>
        <span>Déconnexion</span>
      </button> 
    
      <a routerLink="/" class="btn-retour-accueil">
      <span class="nav-icon">🏠</span>
      <span class="nav-text">Retour à l'accueil</span>
    </a>
    </div>
  </aside>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
