<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">BorneMaroc</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/statistics"
   routerLinkActive="active"
   class="nav-link">
  <span class="nav-icon">⚠️</span>
  <span class="nav-text">vue ensembles </span>
</a>
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">📊</span>
        <span class="nav-text">Dashboard</span>
      </a>
      <a routerLink="/admin/utilisateurs" routerLinkActive="active" class="nav-link">
        <span class="nav-icon">👥</span>
        <span class="nav-text">Utilisateurs</span>
      </a>
      <a routerLink="/admin/signalements"
   routerLinkActive="active"
   class="nav-link">
  <span class="nav-icon">⚠️</span>
  <span class="nav-text">Signalements</span>
</a>

    
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">👤</div>
        <div>
          <div class="user-name">{{ adminName || 'Admin' }}</div>
          <div class="user-role">Administrateur</div>
        </div>
      </div>
      <button class="btn-logout" (click)="logout()">
        🚪 Déconnexion
      </button>
    </div>
  </aside>

  <!-- Contenu principal -->
  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
