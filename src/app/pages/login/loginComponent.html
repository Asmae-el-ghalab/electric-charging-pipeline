<div class="login-container">
  <section>
    <app-navbar></app-navbar></section>
  <div class="login-card">
    <div class="login-header">
      <h2>Connexion</h2>
      <p>Bienvenue sur Bornemaroc</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="email?.invalid && email?.touched"
          placeholder="exemple@email.com"
        >
        <div class="invalid-feedback" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">L'email est requis</span>
          <span *ngIf="email?.errors?.['email']">Format d'email invalide</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="motDePasse">Mot de passe</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="motDePasse"
            formControlName="motDePasse"
            class="form-control"
            [class.is-invalid]="motDePasse?.invalid && motDePasse?.touched"
            placeholder="Votre mot de passe"
          >
          <button type="button" class="password-toggle" (click)="toggleShowPassword()">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <div class="invalid-feedback" *ngIf="motDePasse?.invalid && motDePasse?.touched">
          <span *ngIf="motDePasse?.errors?.['required']">Le mot de passe est requis</span>
          <span *ngIf="motDePasse?.errors?.['minlength']">Minimum 6 caractères</span>
        </div>
      </div>

      <!-- Error Message -->
      <div class="error-message" *ngIf="errorMessage">
        <div class="alert alert-danger">
          {{ errorMessage }}
        </div>
      </div>

      <!-- Forgot Password Link -->
      <div class="forgot-password">
        <a href="javascript:void(0)" (click)="goToForgotPassword()">Mot de passe oublié ?</a>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="btn-login" 
        [disabled]="isLoading || loginForm.invalid"
      >
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <!-- Register Link -->
      <div class="register-link">
        <p>Pas encore de compte ? 
          <a href="javascript:void(0)" (click)="goToRegister()">S'inscrire</a>
        </p>
      </div>
    </form>
  </div>
</div>
